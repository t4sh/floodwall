name: Sync preview from upstream

on:
  schedule:
    - cron: '45 2 * * *' # 8:15 a.m. India time
  workflow_dispatch:

permissions:
  contents: write

concurrency: sync-preview

jobs:
  sync-preview:
    if: github.repository == 't4sh/floodwall'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fast-forward the fork's preview branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream_ref=$(git ls-remote --exit-code https://github.com/erphq/floodwall.git refs/heads/preview)
          upstream_sha=$(cut -f1 <<< "$upstream_ref")
          gh api --method PATCH repos/t4sh/floodwall/git/refs/heads/preview \
            --raw-field sha="$upstream_sha" --field force=false \
            --jq '"Fork preview is at " + .object.sha'
